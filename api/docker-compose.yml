services:
  postgres:
    image: postgres:17

    container_name: elearn

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-elearn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elearn}
      POSTGRES_DB: ${POSTGRES_DB:-elearn}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-elearn} -d ${POSTGRES_DB:-elearn}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local